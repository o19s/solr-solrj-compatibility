services:
 zookeeper:
  image: zookeeper:3.9.4
  ports:
   - "2181:2181"
  environment:
    - ZOO_4LW_COMMANDS_WHITELIST=srvr,mntr,conf,ruok

 solr_the_1st:
  image: solr:9.10.0-slim
  container_name: solr
  ports:
   - "8983:8983"
  depends_on:
   - zookeeper
  environment:
   - ZK_HOST=zookeeper:2181
   - SOLR_HOST=host.docker.internal
   - SOLR_PORT=8983

 solr_the_2nd:
  image: solr:9.10.0-slim
  container_name: solr_the_2nd
  ports:
   - "8984:8984"
  depends_on:
   - zookeeper
  environment:
   - ZK_HOST=zookeeper:2181
   - SOLR_HOST=host.docker.internal
   - SOLR_PORT=8984

 solr_the_3rd:
  image: solr:9.10.0-slim
  container_name: solr_the_3rd
  ports:
   - "8985:8985"
  depends_on:
   - zookeeper
  environment:
   - ZK_HOST=zookeeper:2181
   - SOLR_HOST=host.docker.internal
   - SOLR_PORT=8985
