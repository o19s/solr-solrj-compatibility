name: Publish SolrJ patch to GitHub Packages
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
      - name: Build SolrJ patch and test harness
        run: mvn --batch-mode --no-transfer-progress clean package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to GitHub Packages
        run: |
          mvn --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile=target/solr-solrj-4.5.1-solr9-patched.jar \
            -DpomFile=target/solr-solrj-4.5.1.pom \
            -DartifactId=solr-solrj \
            -DgroupId=org.apache.solr \
            -Dversion=4.5.1 \
            -Dclassifier=solr9-patched \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
