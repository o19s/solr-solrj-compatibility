name: Publish SolrJ patch to GitHub Packages
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
      - name: Build SolrJ patch and test harness
        run: mvn --batch-mode --no-transfer-progress clean package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to GitHub Packages
        run: |
          mvn deploy:deploy-file \
            -Dfile=target/solrj-4.5.1-solr9-patched.jar \
            -DpomFile=target/solr-solrj-4.5.1.pom \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/o19s/solr-solrj-compatibility \
            -Dtoken="${{ secrets.GITHUB_TOKEN }}"
